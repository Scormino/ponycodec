<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pony Town - pony renderer (WebGL)</title>
<style>
	body {
		background: #2b2b3d;
		color: #e0e0e0;
		font: 14px/1.5 Consolas, Menlo, monospace;
		margin: 0;
		padding: 24px;
	}

	h1 {
		font-size: 16px;
		font-weight: normal;
		margin: 0 0 16px;
	}

	canvas {
		background: #181824;
		border: 1px solid #4a4a5e;
		image-rendering: pixelated;
		image-rendering: crisp-edges;
	}

	#error {
		color: #ff8080;
		margin-top: 16px;
		white-space: pre-wrap;
	}

	.info {
		margin-top: 16px;
		max-width: 640px;
	}
</style>
</head>
<body>
<h1>Pony Town - pony renderer (WebGL)</h1>

<canvas id="canvas" width="80" height="70"></canvas>

<div class="info">
	The pony is rendered with the WebGL renderer of the port: the draw commands
	are produced by <code>src/render.ts</code> and the palettes are drawn with
	the shader of the original game
	(<code>example/webgl/shaders/palette-layers.glsl</code>).
</div>

<div id="error"></div>

<script src="loader.js"></script>
<script src="main.js"></script>
</body>
</html>
