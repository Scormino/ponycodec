<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pony Town - pony renderer (WebGL) - verification</title>
<style>
	body {
		background: #2b2b3d;
		color: #e0e0e0;
		font: 14px/1.5 Consolas, Menlo, monospace;
		margin: 0;
		padding: 24px;
	}

	h1 {
		font-size: 16px;
		font-weight: normal;
		margin: 0 0 16px;
	}

	canvas {
		background: #181824;
		border: 1px solid #4a4a5e;
		image-rendering: pixelated;
		image-rendering: crisp-edges;
	}

	#error {
		color: #ff8080;
		margin-top: 16px;
		white-space: pre-wrap;
	}

	#result {
		margin-top: 16px;
		white-space: pre-wrap;
	}

	.info {
		margin-top: 16px;
		max-width: 640px;
	}
</style>
</head>
<body>
<h1>Pony Town - pony renderer (WebGL) - verification</h1>

<canvas id="canvas" width="80" height="70"></canvas>

<div class="info">
	The pony is drawn with the WebGL renderer of the example and the pixels of the
	canvas are compared with the pixels of the CPU rasterizer of the port
	(<code>src/raster.ts</code>), which is loaded in the browser too.
</div>

<pre id="result">loading...</pre>

<div id="error"></div>

<script src="loader.js"></script>
<script src="main.js"></script>
<script src="verify.js"></script>
</body>
</html>
